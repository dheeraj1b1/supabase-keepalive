name: Portfolio keepalive

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install browser wake dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Ping Supabase and ATS front door
        run: node scripts/supabase-keepalive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_KEEPALIVE_TABLE: ${{ vars.SUPABASE_KEEPALIVE_TABLE }}
          SUPABASE_KEEPALIVE_BUCKET: ${{ vars.SUPABASE_KEEPALIVE_BUCKET }}
          SUPABASE_KEEPALIVE_OBJECT: ${{ vars.SUPABASE_KEEPALIVE_OBJECT }}
          STREAMLIT_KEEPALIVE_URL: https://my-ats-007.streamlit.app/_stcore/health

      - name: Wake Streamlit ATS app in browser
        run: npm run wake:streamlit
        env:
          STREAMLIT_APP_URL: https://my-ats-007.streamlit.app/
