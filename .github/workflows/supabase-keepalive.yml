name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: node scripts/supabase-keepalive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_KEEPALIVE_TABLE: ${{ vars.SUPABASE_KEEPALIVE_TABLE }}
          SUPABASE_KEEPALIVE_BUCKET: ${{ vars.SUPABASE_KEEPALIVE_BUCKET }}
          SUPABASE_KEEPALIVE_OBJECT: ${{ vars.SUPABASE_KEEPALIVE_OBJECT }}
